# docker compose down; docker compose up --build --remove-orphans;

services:
  loki-clickhouse:
    restart: always
    build:
      dockerfile: Dockerfile
    ports:
      - 3100:3100
    environment:
      - CLICKHOUSE_URL=http://host.docker.internal:8123
      - CLICKHOUSE_USER
      - CLICKHOUSE_PASSWORD
      - CLICKHOUSE_DATABASE=Statistics
      - PORT=3100
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      bridge:
        ipv4_address: 172.27.0.10
      shared_loki: {}
      loki_event_saver: {}

networks:
  bridge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.27.0.0/16

  # Shared network not used by default
  shared_loki:
    name: shared_loki

  # Shared network used by event-saver
  loki_event_saver:
    name: loki_event_saver
